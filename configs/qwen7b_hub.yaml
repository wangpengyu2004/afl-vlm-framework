# Qwen2.5-VL-7B + HF hub 数据（LLaVA-Instruct-150K 按任务关键字切分）
# 注意: LLaVA-Instruct-150K 只含对话 json，image 列是文件名，
#       需要 image_root 指向 COCO train2014/train2017 解压目录。
# 运行: python -m scripts.run_train --config configs/qwen7b_hub.yaml
experiment:
  name: qwen7b_hub
  seed: 42
  output_dir: runs/qwen7b_hub
  time_scale: 1.0

model:
  name: qwen2.5-vl-7b
  dtype: bf16
  device: auto
  lora: {r: 16, alpha: 32, dropout: 0.05, include_visual: false}
  gradient_checkpointing: true

tasks:
  vqa:
    source:
      type: hf_hub
      dataset_id: liuhaotian/LLaVA-Instruct-150K
      split: train
      image_column: image
      filter_column: id
      filter_keywords: ["vqa", "gqa"]          # id 前缀含 vqa_/gqa_ 的样本
      image_root: /data/coco/train2017         # ← 改成你的 COCO 路径
    eval_ratio: 0.05
    max_train: 2000
    max_eval: 100
  ocr:
    source:
      type: hf_hub
      dataset_id: liuhaotian/LLaVA-Instruct-150K
      split: train
      image_column: image
      filter_column: id
      filter_keywords: ["ocr"]
      image_root: /data/coco/train2017
    eval_ratio: 0.05
    max_train: 2000
    max_eval: 100
  detail:
    source:
      type: hf_hub
      dataset_id: liuhaotian/LLaVA-Instruct-150K
      split: train
      image_column: image
      filter_column: id
      filter_keywords: ["detail_", "complex_reasoning_"]
      image_root: /data/coco/train2017
    eval_ratio: 0.05
    max_train: 2000
    max_eval: 100

clients:
  task_mix: {vqa: 4, ocr: 3, detail: 3}
  num_rounds: 3
  speed_factor: 0.8
  net_delay: {dist: lognormal, mu: 0.5, sigma: 0.6}
  client_lr: 1.0e-4
  batch_size: 2

server:
  aggregation: {name: fedbuff, K: 4, server_lr: 1.0}
  eval_every_batches: 3
  eval_batch_size: 4
  gen_eval_samples: 16
  max_new_tokens: 32
