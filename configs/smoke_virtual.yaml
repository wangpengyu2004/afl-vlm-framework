# 虚拟时钟模式 CPU 冒烟：验证"计划–执行"两阶段全链路
# （planner 调度表 / 按版本等待与快照保留 / 服务器按计划序回放）
# 运行: python -m scripts.run_train --config configs/smoke_virtual.yaml
# 与 smoke_cpu 同种子同数据 → 延迟样本一致，两种模式的时间线可直接对照
base: smoke_cpu.yaml

experiment:
  name: smoke_virtual
  output_dir: runs/smoke_virtual
  timing: virtual          # ← 阶段1 离线调度表（--dry-run 可看），阶段2 按表回放

clients:
  train_seconds: 30        # 虚拟单轮训练秒数：只驱动时间线，与真实耗时无关
  task_profiles:
    taskA: {train_seconds: 20}
    taskB: {train_seconds: 40}
