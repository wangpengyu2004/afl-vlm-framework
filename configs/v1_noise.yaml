# V1 附加工件（--noise）：强噪声应力臂——主线（v1_natural）已含轻度客户端异构
# （speed ±5% + lognormal net_delay），本臂进一步加码：±10% 算力抖动、
# 0–25s 启动错开、更大网络抖动。
# 用途：主线任务→时长链接保留，检验"更真实的硬件/运维噪声下"聚集结构与
# 震荡仍然存在（排除理想化时间线伪影的质疑，与主线方向相反的稳健性检验）
# 运行: python -m scripts.run_vseries --stage v1 --noise
base: v1_natural.yaml

experiment:
  name: v1_noise
  output_dir: runs/v1/noise

clients:
  overrides:
    # speed_factor 抖动（虚拟时长 = train_seconds/speed_factor）+ 启动错开 + 网络延迟
    - {id: c0, speed_factor: 1.10, start_offset: 0.0,  net_delay: {dist: lognormal, mu: 0.2, sigma: 0.3}}
    - {id: c1, speed_factor: 0.95, start_offset: 12.0, net_delay: {dist: lognormal, mu: 0.1, sigma: 0.3}}
    - {id: c2, speed_factor: 1.05, start_offset: 5.0,  net_delay: {dist: lognormal, mu: 0.3, sigma: 0.4}}
    - {id: c3, speed_factor: 0.90, start_offset: 3.0,  net_delay: {dist: lognormal, mu: 0.4, sigma: 0.4}}
    - {id: c4, speed_factor: 1.08, start_offset: 20.0, net_delay: {dist: lognormal, mu: 0.2, sigma: 0.3}}
    - {id: c5, speed_factor: 0.97, start_offset: 8.0,  net_delay: {dist: lognormal, mu: 0.3, sigma: 0.3}}
    - {id: c6, speed_factor: 1.02, start_offset: 15.0, net_delay: {dist: lognormal, mu: 0.2, sigma: 0.4}}
    - {id: c7, speed_factor: 0.92, start_offset: 1.0,  net_delay: {dist: lognormal, mu: 0.5, sigma: 0.3}}
    - {id: c8, speed_factor: 1.06, start_offset: 25.0, net_delay: {dist: lognormal, mu: 0.1, sigma: 0.3}}

server:
  probe_on_apply: false        # 噪声臂不做 delta 级探针（V1 结构验证用）
